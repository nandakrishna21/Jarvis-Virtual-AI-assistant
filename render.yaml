# Render Blueprint for the JARVIS public demo.
# FastAPI serves both the API and the built React app from one Docker image,
# so there is no CORS or second service to pay for.
services:
  - type: web
    name: jarvis-demo
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    region: singapore
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: LLM_PROVIDER
        value: nvidia
      - key: NVIDIA_MODEL
        value: nvidia/nemotron-3.5-bolt-e4b
      - key: NVIDIA_BASE_URL
        value: https://integrate.api.nvidia.com/v1
      # Set the real value in the Render dashboard (secret, never in git).
      - key: NVIDIA_API_KEY
        sync: false
      # Public showcase: safe read + chat only, rate limited per visitor.
      - key: DEMO_MODE
        value: "true"
      - key: JARVIS_API_KEY
        value: ""
      - key: N8N_ENABLED
        value: "false"
      - key: DATABASE_URL
        value: sqlite:///./jarvis.db
      # Same-origin deployment, so no cross-origin frontend needs to be listed.
      - key: CORS_ORIGINS
        value: ""
      - key: RATE_LIMIT_CHAT_PER_MINUTE
        value: "20"
      - key: RATE_LIMIT_VOICE_PER_MINUTE
        value: "15"
      - key: RATE_LIMIT_API_PER_MINUTE
        value: "180"
