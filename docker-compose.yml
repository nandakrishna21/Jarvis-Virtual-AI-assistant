# Optional services for JARVIS (not required for the default local SQLite+Ollama mode).
# Use when you want containerized n8n and/or PostgreSQL.
#
# Start:   docker compose up -d
# n8n UI:  http://127.0.0.1:5678
#
# Notes:
# - On this machine Docker Desktop service was stopped by default.
# - Core JARVIS works without Docker using SQLite and local Ollama.

services:
  n8n:
    image: n8nio/n8n:latest
    container_name: jarvis-n8n
    restart: unless-stopped
    ports:
      - "127.0.0.1:5678:5678"
    environment:
      - N8N_HOST=127.0.0.1
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - N8N_USER_MANAGEMENT_DISABLED=true
      - N8N_DIAGNOSTICS_ENABLED=false
    volumes:
      - ./n8n:/home/node/.n8n

  # Optional future PostgreSQL (current default is SQLite)
